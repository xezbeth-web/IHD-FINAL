<!doctype html>
<html lang="en-PH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0e12" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--font-preload-->
    <script>
      (function () {
        var d = document.documentElement;
        // Scroll-reveal hides content only when JS runs; if the app never hydrates, show everything.
        // (main.tsx puts the class back if hydration finishes later, e.g. on a slow connection.)
        d.classList.add('js');
        setTimeout(function () {
          if (!window.__ihdHydrated) d.classList.remove('js');
        }, 4000);
        // The opening reveal waits for the brand fonts (capped at 1.2s), so the headline first
        // appears in its final font and never re-wraps on screen when the web font swaps in.
        var ready = function () { d.classList.add('fonts-ready'); };
        try {
          Promise.race([
            Promise.all([
              document.fonts.load('300 1em "Plus Jakarta Sans Variable"'),
              document.fonts.load('300 1em "Inter Variable"'),
              document.fonts.load('500 1em "JetBrains Mono Variable"')
            ]),
            new Promise(function (r) { setTimeout(r, 1200); })
          ]).then(ready, ready);
        } catch (e) {
          ready();
        }
        // Boot screen: first page view of a session only, never for crawlers or reduced-motion users.
        try {
          if (
            sessionStorage.getItem('ihd-boot') !== '1' &&
            !matchMedia('(prefers-reduced-motion: reduce)').matches &&
            !/bot|crawl|spider|slurp|facebookexternalhit|embedly|preview/i.test(navigator.userAgent)
          ) {
            d.classList.add('booting');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      #boot { display: none; }
      .booting, .booting body { overflow: hidden; }
      .booting #boot {
        position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
        background: #0c0e12; color: #9ca3af; overflow: hidden;
        font: 500 10.5px/1 "JetBrains Mono Variable", "JetBrains Mono Fallback", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.2em; text-transform: uppercase;
      }
      #boot .grid {
        position: absolute; inset: -1px;
        background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
        background-size: 56px 56px; background-position: center;
        -webkit-mask-image: radial-gradient(ellipse at center, #000 10%, transparent 70%);
        mask-image: radial-gradient(ellipse at center, #000 10%, transparent 70%);
        animation: boot-fade .6s ease-out both;
      }
      /* CRT scanlines and a slow sweep */
      #boot::before {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
      }
      #boot::after {
        content: ''; position: absolute; left: 0; right: 0; top: 0; height: 22vh; pointer-events: none;
        background: linear-gradient(180deg, transparent, rgba(129,140,248,.07), transparent);
        animation: boot-sweep 2.2s linear infinite;
      }
      #boot .box { position: relative; width: min(300px, 72vw); padding: 40px 32px 30px; }
      #boot .cn { position: absolute; width: 12px; height: 12px; border-color: rgba(255,255,255,.28); border-style: solid; border-width: 0; }
      #boot .tl { top: 0; left: 0; border-top-width: 1px; border-left-width: 1px; }
      #boot .tr { top: 0; right: 0; border-top-width: 1px; border-right-width: 1px; }
      #boot .bl { bottom: 0; left: 0; border-bottom-width: 1px; border-left-width: 1px; }
      #boot .br { bottom: 0; right: 0; border-bottom-width: 1px; border-right-width: 1px; }
      #boot .g { position: relative; width: 62%; margin: 0 auto 30px; animation: boot-flicker .7s steps(1) both, boot-jolt 1.6s steps(1) .7s infinite; }
      #boot .g svg { display: block; width: 100%; height: auto; }
      #boot .g .l { position: absolute; inset: 0; mix-blend-mode: screen; opacity: .85; clip-path: inset(50% 0 50% 0); }
      #boot .l1 { --a: #22d3ee; --b: #22d3ee; animation: boot-slice-a 1.6s steps(1) .5s infinite; }
      #boot .l2 { --a: #e879f9; --b: #e879f9; animation: boot-slice-b 1.6s steps(1) .5s infinite; }
      #boot .row { display: flex; justify-content: space-between; gap: 16px; white-space: nowrap; }
      #boot .bar + .row { margin-top: 12px; }
      #boot .dim { color: #7d8594; }
      #boot .hi { color: #f8fafc; }
      #boot .bar { position: relative; height: 1px; margin-top: 12px; background: rgba(255,255,255,.12); overflow: hidden; }
      #boot .bar i { position: absolute; inset: 0; background: #818cf8; box-shadow: 0 0 8px #818cf8; transform: scaleX(0); transform-origin: left; }
      #boot .ok { color: #818cf8; }
      #boot.out { animation: boot-crt .55s cubic-bezier(.6,0,.4,1) forwards; }
      #boot.out .g { animation: boot-jolt .12s steps(1) infinite; }
      @keyframes boot-fade { from { opacity: 0; } }
      @keyframes boot-sweep { from { transform: translateY(-22vh); } to { transform: translateY(100vh); } }
      @keyframes boot-flicker {
        0% { opacity: 0; } 10% { opacity: .9; } 16% { opacity: .1; } 24% { opacity: 1; }
        34% { opacity: .3; } 40%, 100% { opacity: 1; }
      }
      @keyframes boot-jolt {
        0%, 100% { transform: none; }
        8% { transform: translateX(-4px) skewX(-6deg); } 10% { transform: none; }
        52% { transform: translateX(3px); } 54% { transform: translateX(-2px) skewX(4deg); } 56% { transform: none; }
      }
      @keyframes boot-slice-a {
        0% { clip-path: inset(8% 0 74% 0); transform: translateX(-7px); }
        4% { clip-path: inset(62% 0 14% 0); transform: translateX(5px); }
        8% { clip-path: inset(30% 0 52% 0); transform: translateX(-3px); }
        12%, 48% { clip-path: inset(50% 0 50% 0); transform: none; }
        50% { clip-path: inset(80% 0 4% 0); transform: translateX(6px); }
        54% { clip-path: inset(18% 0 66% 0); transform: translateX(-5px); }
        58%, 100% { clip-path: inset(50% 0 50% 0); transform: none; }
      }
      @keyframes boot-slice-b {
        0% { clip-path: inset(44% 0 36% 0); transform: translateX(6px); }
        4% { clip-path: inset(4% 0 82% 0); transform: translateX(-6px); }
        8% { clip-path: inset(70% 0 12% 0); transform: translateX(4px); }
        12%, 48% { clip-path: inset(50% 0 50% 0); transform: none; }
        50% { clip-path: inset(26% 0 58% 0); transform: translateX(-7px); }
        54% { clip-path: inset(56% 0 30% 0); transform: translateX(4px); }
        58%, 100% { clip-path: inset(50% 0 50% 0); transform: none; }
      }
      @keyframes boot-crt {
        0% { transform: none; filter: none; }
        45% { transform: scale(1, .004); filter: brightness(2.5); opacity: 1; }
        100% { transform: scale(0, .004); filter: brightness(3); opacity: 0; }
      }
    </style>
    <!--app-head-->
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg width="0" height="0" style="position: absolute">
        <symbol id="ihd-glyph" viewBox="12 15 432 253">
          <g style="fill: var(--a, #7b05ba)">
            <circle cx="41" cy="44.5" r="29.5" />
            <rect x="16" y="99" width="52" height="169" />
            <rect x="84" y="33" width="52" height="235" />
            <rect x="136" y="129" width="100" height="42" />
            <rect x="236" y="33" width="52" height="235" />
          </g>
          <path style="fill: var(--b, #d6d6d6)" fill-rule="evenodd" d="M288 33H336C404 33 444 80 444 150.5S404 268 336 268H288ZM288 75H331C369 75 394 107 394 150.5S369 226 331 226H288Z" />
        </symbol>
      </svg>
      <div class="grid"></div>
      <div class="box">
        <span class="cn tl"></span><span class="cn tr"></span><span class="cn bl"></span><span class="cn br"></span>
        <div class="g">
          <svg viewBox="0 0 432 253"><use href="#ihd-glyph" /></svg>
          <svg class="l l1" viewBox="0 0 432 253"><use href="#ihd-glyph" /></svg>
          <svg class="l l2" viewBox="0 0 432 253"><use href="#ihd-glyph" /></svg>
        </div>
        <div class="row"><span class="hi">IHD Philippines</span><span class="hi" data-pct>000%</span></div>
        <div class="bar"><i></i></div>
        <div class="row"><span class="dim" data-status>Initialising</span><span class="dim" data-state>Sys</span></div>
      </div>
      <script>
        (function () {
          var d = document.documentElement;
          var el = document.getElementById('boot');
          if (!d.classList.contains('booting')) return el.remove();
          try { sessionStorage.setItem('ihd-boot', '1'); } catch (e) {}
          var pct = el.querySelector('[data-pct]');
          var status = el.querySelector('[data-status]');
          var state = el.querySelector('[data-state]');
          var bar = el.querySelector('.bar i');
          var steps = ['01 Acoustics', '02 Audiovisual', '03 Security', '04 IT & ELV', '05 BMS & IoT', '06 GRMS'];
          // The page loads and hydrates underneath this overlay, so its JavaScript stays light:
          // the bar is one compositor-only CSS transition, and text updates run at ~11 fps
          // instead of every frame (per-frame text writes measurably blocked slow phones).
          var duration = 1700, start = Date.now(), finished = false, current = -1;
          // Labels "decode" from random glyphs into the real text.
          var glyphs = '█▓▒░<>/\\|_#=+*0123456789ABCDEF';
          var scramble = function (node, text) {
            var frame = 0, frames = 5;
            clearInterval(node._s);
            node._s = setInterval(function () {
              frame++;
              var shown = Math.floor((frame / frames) * text.length);
              var out = text.slice(0, shown);
              for (var i = shown; i < text.length; i++) out += text[i] === ' ' ? ' ' : glyphs[(Math.random() * glyphs.length) | 0];
              node.textContent = out;
              if (frame >= frames) { clearInterval(node._s); node.textContent = text; }
            }, 50);
          };
          scramble(el.querySelector('.row .hi'), 'IHD Philippines');
          var finish = function () {
            if (finished) return;
            finished = true;
            scramble(status, 'Systems online');
            state.textContent = 'OK';
            state.className = 'ok';
            setTimeout(function () {
              el.classList.add('out');
              window.__ihdBooted = true;
              window.dispatchEvent(new Event('ihd:booted'));
              setTimeout(function () { d.classList.remove('booting'); el.remove(); }, 560);
            }, 320);
          };
          bar.style.transition = 'transform ' + duration + 'ms cubic-bezier(0.33, 1, 0.68, 1)';
          requestAnimationFrame(function () {
            requestAnimationFrame(function () { bar.style.transform = 'scaleX(1)'; });
          });
          var ticker = setInterval(function () {
            var p = Math.min(1, (Date.now() - start) / duration);
            var e = 1 - Math.pow(1 - p, 3);
            pct.textContent = ('00' + Math.round(e * 100)).slice(-3) + '%';
            var step = Math.min(steps.length - 1, Math.floor(e * steps.length));
            if (step !== current) scramble(status, steps[(current = step)]);
            if (p >= 1) { clearInterval(ticker); finish(); }
          }, 90);
          // Never trap the page behind the overlay (e.g. if timers are throttled in a background tab).
          setTimeout(finish, 3500);
        })();
      </script>
    </div>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
